<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clovebot.my</title>
  <meta name="description" content="Clove is a personal AI assistant and operator dashboard for email monitoring, calendar management, and knowledge base operations.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b10;
      --panel: #101823;
      --ink: #eef6ff;
      --muted: #9aadbf;
      --accent: #65ff9b;
      --line: rgba(238, 246, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 20% 15%, rgba(101, 255, 155, 0.14), transparent 24rem),
        radial-gradient(circle at 80% 80%, rgba(132, 182, 255, 0.12), transparent 22rem),
        linear-gradient(135deg, var(--bg), #0b1119 60%, #05070a);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 8vw, 4.5rem);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(16, 24, 35, 0.76);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .avatar {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.5rem;
      display: block;
      border-radius: 1.35rem;
      border: 1px solid rgba(101, 255, 155, 0.28);
      background: rgba(101, 255, 155, 0.08);
      box-shadow: 0 0 36px rgba(101, 255, 155, 0.16);
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    p {
      margin: 1.25rem auto 0;
      max-width: 30rem;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.2rem);
    }

    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: border-color 0.2s, background 0.2s;
    }

    .links a:hover {
      border-color: var(--accent);
      background: rgba(101, 255, 155, 0.06);
    }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="assets/clove-avatar.png" alt="Clove avatar">
    <h1>clovebot.my</h1>
    <p>Clove is a personal AI assistant and operator dashboard. It provides email monitoring, calendar management, and knowledge base operations for its operator.</p>
    <div class="links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
    </div>
  </main>
</body>
</html>
